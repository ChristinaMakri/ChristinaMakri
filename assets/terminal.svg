  <text x="24" y="342" class="out a" style="animation-delay:6.17s">changes the way software can solve problems.</text>
  <text x="24" y="386" class="out a" style="animation-delay:6.29s">Today I work as an AI Engineer, building applications around LLMs and AI agents.</text>
  <text x="24" y="408" class="out a" style="animation-delay:6.35s">What I enjoy most isn’t the model itself; it’s everything around it: designing</text>
