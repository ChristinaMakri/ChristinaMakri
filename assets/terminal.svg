    }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size:15px; fill:var(--fg); white-space:pre; }
    .win { fill:var(--bg); stroke:var(--border); }
    .bar { fill:var(--bar); }
    .p { fill:var(--p); }
    .name { font-size:24px; font-weight:700; fill:var(--name); }
    .cursor { fill:var(--fg); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .a { animation: show 0.01s both; }
    @keyframes show { from { opacity:0; } to { opacity:1; } }
  </style>
