<svg xmlns="http://www.w3.org/2000/svg" width="820" height="604" viewBox="0 0 820 604" role="img" aria-label="Christina Makri — AI Engineer @ Netcompany. MSc in Artificial Intelligence. Based in Thessaloniki, Greece. I started my career writing backend software, learning how production systems are built, maintained, and scaled. Over time, I found myself increasingly drawn to Artificial Intelligence, not because it was the latest trend, but because it changes the way software can solve problems. Today I work as an AI Engineer, building applications around LLMs and AI agents. What I enjoy most isn’t the model itself; it’s everything around it: designing the architecture, connecting the pieces, making systems reliable, and turning an idea into something people can actually use. I like working where software engineering meets AI. To me, good AI isn’t just about getting impressive responses. It’s about building systems that are dependable, maintainable, and ready for production.">
  <style>
    :root { --bg:#f6f8fa; --bar:#eaeef2; --fg:#24292f; --muted:#57606a; --p:#0969da; --name:#8250df; --border:#d0d7de; }
    @media (prefers-color-scheme: dark) {
