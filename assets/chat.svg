  <g class="win" style="animation-delay:2.02s;animation-duration:1.00s"><circle cx="40" cy="155" r="14" class="av"/><text x="40" y="160" class="avt" text-anchor="middle">CM</text><rect x="64" y="136" width="66" height="38" rx="19" class="ab"/><circle cx="86" cy="155" r="4" class="dot" style="animation-delay:0.00s"/><circle cx="100" cy="155" r="4" class="dot" style="animation-delay:0.15s"/><circle cx="114" cy="155" r="4" class="dot" style="animation-delay:0.30s"/></g>
  <g class="pop" style="animation-delay:3.02s"><circle cx="40" cy="155" r="14" class="av"/><text x="40" y="160" class="avt" text-anchor="middle">CM</text><rect x="64" y="136" width="732" height="126" rx="16" class="ab"/><text x="84" y="178" class="name">Christina Makri</text><text x="84" y="200" class="at">AI Engineer @ Netcompany</text><text x="84" y="222" class="at">MSc in Artificial Intelligence</text><text x="84" y="244" class="at">Based in Thessaloniki, Greece</text></g>
  <g class="pop" style="animation-delay:5.78s"><rect x="562" y="284" width="234" height="38" rx="19" class="ub"/><text x="580" y="308" class="ut">Tell me about your journey</text></g>
  <g class="win" style="animation-delay:6.08s;animation-duration:1.20s"><circle cx="40" cy="359" r="14" class="av"/><text x="40" y="364" class="avt" text-anchor="middle">CM</text><rect x="64" y="340" width="66" height="38" rx="19" class="ab"/><circle cx="86" cy="359" r="4" class="dot" style="animation-delay:0.00s"/><circle cx="100" cy="359" r="4" class="dot" style="animation-delay:0.15s"/><circle cx="114" cy="359" r="4" class="dot" style="animation-delay:0.30s"/></g>
  <g class="pop" style="animation-delay:7.28s"><circle cx="40" cy="359" r="14" class="av"/><text x="40" y="364" class="avt" text-anchor="middle">CM</text><rect x="64" y="340" width="732" height="294" rx="16" class="ab"/><text x="84" y="372" class="at a" style="animation-delay:7.38s">I started my career writing backend software, learning how production systems</text><text x="84" y="394" class="at a" style="animation-delay:7.48s">are built, maintained, and scaled. Over time, I found myself increasingly drawn</text><text x="84" y="416" class="at a" style="animation-delay:7.58s">to Artificial Intelligence, not because it was the latest trend, but because it</text><text x="84" y="438" class="at a" style="animation-delay:7.68s">changes the way software can solve problems.</text><text x="84" y="472" class="at a" style="animation-delay:7.78s">Today I work as an AI Engineer, building applications around LLMs and AI agents.</text><text x="84" y="494" class="at a" style="animation-delay:7.88s">What I enjoy most isn’t the model itself; it’s everything around it: designing</text><text x="84" y="516" class="at a" style="animation-delay:7.98s">the architecture, connecting the pieces, making systems reliable, and turning an</text><text x="84" y="538" class="at a" style="animation-delay:8.08s">idea into something people can actually use.</text><text x="84" y="572" class="at a" style="animation-delay:8.18s">I like working where software engineering meets AI. To me, good AI isn’t just</text><text x="84" y="594" class="at a" style="animation-delay:8.28s">about getting impressive responses. It’s about building systems that are</text><text x="84" y="616" class="at a" style="animation-delay:8.38s">dependable, maintainable, and ready for production.</text></g>
