<svg xmlns="http://www.w3.org/2000/svg" width="820" height="720" viewBox="0 0 820 720" role="img" aria-label="Christina Makri — AI Engineer @ Netcompany. MSc in Artificial Intelligence. Based in Thessaloniki, Greece. I started my career writing backend software, learning how production systems are built, maintained, and scaled. Over time, I found myself increasingly drawn to Artificial Intelligence, not because it was the latest trend, but because it changes the way software can solve problems. Today I work as an AI Engineer, building applications around LLMs and AI agents. What I enjoy most isn’t the model itself; it’s everything around it: designing the architecture, connecting the pieces, making systems reliable, and turning an idea into something people can actually use. I like working where software engineering meets AI. To me, good AI isn’t just about getting impressive responses. It’s about building systems that are dependable, maintainable, and ready for production.">
  <style>
    :root { --bg:#ffffff; --bar:#f6f8fa; --fg:#24292f; --muted:#57606a; --p:#0969da; --name:#8250df; --border:#d0d7de; --ab:#f6f8fa; --ok:#1a7f37; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --bar:#161b22; --fg:#c9d1d9; --muted:#8b949e; --p:#1f6feb; --name:#d2a8ff; --border:#30363d; --ab:#161b22; --ok:#3fb950; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size:15px; fill:var(--fg); }
    .frame { fill:var(--bg); stroke:var(--border); }
    .bar { fill:var(--bar); }
    .sep { stroke:var(--border); }
    .title { font-weight:600; }
    .sub { font-size:12px; fill:var(--muted); }
    .okdot { fill:var(--ok); }
    .ub { fill:var(--p); }
    .ut { fill:#ffffff; }
    .ab { fill:var(--ab); stroke:var(--border); }
    .av { fill:var(--name); }
    .avt { font-size:11px; font-weight:700; fill:#ffffff; }
    .name { font-size:22px; font-weight:700; fill:var(--name); }
    .inbox { fill:var(--bg); stroke:var(--border); }
    .ph { fill:var(--muted); }
    .send { fill:var(--p); }
    .dot { fill:var(--muted); animation: bounce 0.9s ease-in-out infinite; }
    @keyframes bounce { 0%,60%,100% { opacity:.35; } 30% { opacity:1; } }
    .cursor { fill:var(--fg); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .a { animation: show 0.01s both; }
    @keyframes show { from { opacity:0; } to { opacity:1; } }
    .pop { animation: pop 0.3s ease-out both; }
    @keyframes pop { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .win { opacity:0; animation-name: on; animation-timing-function: steps(1); }
    @keyframes on { from, to { opacity:1; } }
  </style>
  <rect x="1" y="1" width="818" height="718" rx="12" class="frame"/>
