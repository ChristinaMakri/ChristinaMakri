  <text x="44" y="685" class="inp win" style="animation-delay:3.62s;animation-duration:2.16s"><tspan class="a" style="animation-delay:3.92s">T</tspan><tspan class="a" style="animation-delay:3.98s">e</tspan><tspan class="a" style="animation-delay:4.04s">l</tspan><tspan class="a" style="animation-delay:4.10s">l</tspan><tspan class="a" style="animation-delay:4.16s"> </tspan><tspan class="a" style="animation-delay:4.22s">m</tspan><tspan class="a" style="animation-delay:4.28s">e</tspan><tspan class="a" style="animation-delay:4.34s"> </tspan><tspan class="a" style="animation-delay:4.40s">a</tspan><tspan class="a" style="animation-delay:4.46s">b</tspan><tspan class="a" style="animation-delay:4.52s">o</tspan><tspan class="a" style="animation-delay:4.58s">u</tspan><tspan class="a" style="animation-delay:4.64s">t</tspan><tspan class="a" style="animation-delay:4.70s"> </tspan><tspan class="a" style="animation-delay:4.76s">y</tspan><tspan class="a" style="animation-delay:4.82s">o</tspan><tspan class="a" style="animation-delay:4.88s">u</tspan><tspan class="a" style="animation-delay:4.94s">r</tspan><tspan class="a" style="animation-delay:5.00s"> </tspan><tspan class="a" style="animation-delay:5.06s">j</tspan><tspan class="a" style="animation-delay:5.12s">o</tspan><tspan class="a" style="animation-delay:5.18s">u</tspan><tspan class="a" style="animation-delay:5.24s">r</tspan><tspan class="a" style="animation-delay:5.30s">n</tspan><tspan class="a" style="animation-delay:5.36s">e</tspan><tspan class="a" style="animation-delay:5.42s">y</tspan></text>
