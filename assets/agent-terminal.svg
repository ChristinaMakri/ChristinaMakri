  <text x="24" y="452" class="a" style="animation-delay:9.10s"><tspan class="bio">     I started my career writing backend software, learning how production systems</tspan></text>
  <text x="24" y="473" class="a" style="animation-delay:9.19s"><tspan class="bio">     are built, maintained, and scaled. Over time, I found myself increasingly drawn</tspan></text>
  <text x="24" y="494" class="a" style="animation-delay:9.28s"><tspan class="bio">     to Artificial Intelligence, not because it was the latest trend, but because it</tspan></text>
  <text x="24" y="515" class="a" style="animation-delay:9.37s"><tspan class="bio">     changes the way software can solve problems.</tspan></text>
  <text x="24" y="549" class="a" style="animation-delay:9.46s"><tspan class="bio">     Today I work as an AI Engineer, building applications around LLMs and AI agents.</tspan></text>
  <text x="24" y="570" class="a" style="animation-delay:9.55s"><tspan class="bio">     What I enjoy most isn’t the model itself; it’s everything around it: designing</tspan></text>
  <text x="24" y="591" class="a" style="animation-delay:9.64s"><tspan class="bio">     the architecture, connecting the pieces, making systems reliable, and turning an</tspan></text>
  <text x="24" y="612" class="a" style="animation-delay:9.73s"><tspan class="bio">     idea into something people can actually use.</tspan></text>
  <text x="24" y="646" class="a" style="animation-delay:9.82s"><tspan class="bio">     I like working where software engineering meets AI. To me, good AI isn’t just</tspan></text>
  <text x="24" y="667" class="a" style="animation-delay:9.91s"><tspan class="bio">     about getting impressive responses. It’s about building systems that are</tspan></text>
  <text x="24" y="688" class="a" style="animation-delay:10.00s"><tspan class="bio">     dependable, maintainable, and ready for production.</tspan></text>
